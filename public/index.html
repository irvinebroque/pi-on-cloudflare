<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi Agent on Cloudflare</title>
<link rel="stylesheet" href="/kumo.css">
<style>
.kumo-card { box-shadow: 0 1px 0 var(--color-kumo-shadow-edge), 0 12px 32px var(--color-kumo-shadow-drop); }
.bubble { max-width: min(42rem, 88%); }
</style>
</head>
<body class="min-h-screen bg-kumo-canvas text-kumo-default antialiased">
<main class="mx-auto grid min-h-screen w-full max-w-4xl content-center gap-6 px-5 py-8">
  <header class="mx-auto max-w-2xl text-center">
    <div class="mb-4 inline-flex rounded-full border border-kumo-hairline bg-kumo-base px-3 py-1 text-sm font-medium text-kumo-subtle shadow-xs">Cloudflare Agents SDK + Pi</div>
    <h1 class="text-4xl font-semibold tracking-tight text-kumo-strong md:text-5xl">Pi Agent on Cloudflare</h1>
    <p class="mt-3 text-balance text-kumo-subtle">A Kumo-styled chat demo backed by one Durable Object. Each prompt runs through an Agents SDK fiber, Pi, and AI Gateway.</p>
  </header>

  <section class="kumo-card overflow-hidden rounded-2xl border border-kumo-hairline bg-kumo-base">
    <div class="flex flex-col gap-3 border-b border-kumo-hairline bg-kumo-elevated px-5 py-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <div class="text-sm font-medium text-kumo-subtle">Durable Object</div>
        <div class="text-lg font-semibold text-kumo-strong">PiAgent/default</div>
      </div>
      <div class="flex flex-wrap gap-2 text-xs text-kumo-subtle">
        <span class="rounded-full border border-kumo-hairline bg-kumo-base px-2.5 py-1">Requests <b id="requests" class="text-kumo-strong">-</b></span>
        <span class="rounded-full border border-kumo-hairline bg-kumo-base px-2.5 py-1">Recoveries <b id="recoveries" class="text-kumo-strong">-</b></span>
        <span id="model" class="rounded-full border border-kumo-hairline bg-kumo-base px-2.5 py-1 font-mono">Loading model...</span>
      </div>
    </div>

    <div id="messages" class="flex min-h-72 flex-col gap-3 bg-kumo-canvas/60 p-5">
      <div class="bubble rounded-2xl border border-kumo-hairline bg-kumo-base px-4 py-3 text-kumo-strong shadow-xs">Ready. Ask Pi something about running on Cloudflare.</div>
    </div>

    <form id="chat" class="space-y-3 border-t border-kumo-hairline bg-kumo-elevated p-5">
      <label class="block space-y-2">
        <span class="text-sm font-medium text-kumo-strong">Prompt</span>
        <textarea id="prompt" class="min-h-28 w-full resize-y rounded-lg border border-kumo-line bg-kumo-control px-3 py-2 text-kumo-default shadow-xs outline-none ring-kumo-focus transition placeholder:text-kumo-placeholder focus:ring-2">Say hello from Pi running inside a Cloudflare Durable Object.</textarea>
      </label>
      <button id="run" class="inline-flex w-full items-center justify-center rounded-lg bg-kumo-brand px-4 py-2.5 font-medium text-kumo-inverse shadow-xs transition hover:bg-kumo-brand-hover disabled:cursor-wait disabled:opacity-70">Ask Pi</button>
    </form>
  </section>
</main>

<script>
const form = document.getElementById("chat");
const messages = document.getElementById("messages");
const model = document.getElementById("model");
const requests = document.getElementById("requests");
const recoveries = document.getElementById("recoveries");
const prompt = document.getElementById("prompt");
const run = document.getElementById("run");

function bubble(text, who) {
  const el = document.createElement("div");
  el.className = who === "user"
    ? "bubble ml-auto rounded-2xl bg-kumo-brand px-4 py-3 text-kumo-inverse shadow-xs"
    : "bubble rounded-2xl border border-kumo-hairline bg-kumo-base px-4 py-3 text-kumo-strong shadow-xs";
  el.textContent = text;
  messages.append(el);
  el.scrollIntoView({ block: "nearest" });
  return el;
}

function renderStatus(data) {
  model.textContent = data.model || "-";
  requests.textContent = data.state?.requests ?? data.requests ?? "-";
  recoveries.textContent = data.recoveries ?? "-";
}

async function showStatus() {
  const response = await fetch("/api/status");
  renderStatus(await response.json());
}

form.onsubmit = async (event) => {
  event.preventDefault();
  const text = prompt.value.trim();
  if (!text) return;

  bubble(text, "user");
  const pending = bubble("Thinking...", "assistant");
  run.disabled = true;

  const response = await fetch("/api/prompt", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ prompt: text })
  });
  const data = await response.json();
  pending.textContent = data.answer || data.error || "No answer returned.";
  renderStatus(data);
  run.disabled = false;
};

showStatus();
</script>
</body>
</html>
